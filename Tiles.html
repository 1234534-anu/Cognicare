<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Connect Memory Game</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100%;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    * {
      box-sizing: border-box;
    }

    .game-container {
      width: 100%;
      max-width: 1000px;
      padding: 40px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      margin: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .game-title {
      font-size: 48px;
      font-weight: bold;
      margin: 0 0 10px 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 24px;
      color: #666;
      margin: 0;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-bottom: 30px;
      font-size: 20px;
      color: #333;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-label {
      font-weight: 600;
    }

    .stat-value {
      font-weight: bold;
      color: #667eea;
    }

    .game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 30px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      position: relative;
      overflow: hidden;
    }

    .card:hover:not(.flipped):not(.matched) {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .card.flipped {
      background: white;
      border: 3px solid #667eea;
    }

    .card.matched {
      background: #e8f5e9;
      border: 3px solid #4caf50;
      cursor: default;
    }

    .card-back {
      font-size: 40px;
      color: white;
    }

    .card-front {
      display: none;
    }

    .card.flipped .card-back,
    .card.matched .card-back {
      display: none;
    }

    .card.flipped .card-front,
    .card.matched .card-front {
      display: block;
    }

    .question-panel {
      background: linear-gradient(135deg, #fff5e6 0%, #ffe6f0 100%);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      border: 2px solid #667eea;
    }

    .question-title {
      font-size: 22px;
      font-weight: bold;
      color: #333;
      margin: 0 0 15px 0;
      text-align: center;
    }

    .question-text {
      font-size: 20px;
      color: #555;
      text-align: center;
      line-height: 1.6;
      font-style: italic;
    }

    .question-hint {
      font-size: 16px;
      color: #888;
      text-align: center;
      margin-top: 10px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn {
      padding: 15px 35px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
    }

    .btn-secondary {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }

    .btn-secondary:hover {
      background: #f5f5f5;
      transform: translateY(-2px);
    }

    .win-screen {
      display: none;
      text-align: center;
      padding: 40px;
      background: linear-gradient(135deg, #fff5e6 0%, #ffe6f0 100%);
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .win-screen.show {
      display: block;
    }

    .win-emoji {
      font-size: 80px;
      margin-bottom: 20px;
    }

    .win-title {
      font-size: 36px;
      font-weight: bold;
      color: #333;
      margin: 0 0 15px 0;
    }

    .win-stats {
      font-size: 20px;
      color: #666;
      margin-bottom: 25px;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="game-container">
   <div class="header">
    <h1 class="game-title" id="gameTitle">Team Connect</h1>
    <p class="subtitle" id="subtitle">Memory Game Ice Breaker</p>
   </div>
   <div class="stats">
    <div class="stat-item"><span class="stat-label">Moves:</span> <span class="stat-value" id="moves">0</span>
    </div>
    <div class="stat-item"><span class="stat-label">Pairs Found:</span> <span class="stat-value" id="pairs">0/6</span>
    </div>
   </div>
   <div class="win-screen" id="winScreen">
    <div class="win-emoji">
     🎉
    </div>
    <h2 class="win-title" id="winMessage">Amazing work! You've connected all pairs!</h2>
    <div class="win-stats" id="winStats"></div>
   </div>
   <div class="question-panel" id="questionPanel">
    <h3 class="question-title">💬 Ice Breaker Question</h3>
    <p class="question-text" id="questionText">Match pairs to unlock conversation starters!</p>
    <p class="question-hint">Find a match to reveal your first question</p>
   </div>
   <div class="game-board" id="gameBoard"></div>
   <div class="controls"><button class="btn btn-primary" id="newGameBtn">New Game</button> <button class="btn btn-secondary" id="nextQuestionBtn" style="display: none;">Next Question</button>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: "Team Connect",
      subtitle: "Memory Game Ice Breaker",
      win_message: "Amazing work! You've connected all pairs!"
    };

    const emojis = ['☕', '💡', '🎯', '🚀', '🎨', '🌟'];
    
    const questions = [
      "What emoji best describes your morning?",
      "If you could master any skill instantly, what would it be?",
      "What's your go-to productivity hack?",
      "What's a work skill you're proud of developing?",
      "If your job was a sport, what sport would it be?",
      "What's the best advice you've ever received?",
      "What's your favorite way to celebrate small wins?",
      "If you could have coffee with anyone, who would it be?",
      "What's a hobby you've always wanted to try?",
      "What's one thing on your desk that makes you smile?"
    ];

    let cards = [];
    let flippedCards = [];
    let matchedPairs = 0;
    let moves = 0;
    let currentQuestionIndex = 0;
    let questionsUnlocked = 0;

    function initGame() {
      cards = [...emojis, ...emojis]
        .map((emoji, index) => ({ emoji, id: index }))
        .sort(() => Math.random() - 0.5);
      
      flippedCards = [];
      matchedPairs = 0;
      moves = 0;
      currentQuestionIndex = 0;
      questionsUnlocked = 0;
      
      renderBoard();
      updateStats();
      resetQuestion();
      document.getElementById('winScreen').classList.remove('show');
      document.getElementById('nextQuestionBtn').style.display = 'none';
    }

    function renderBoard() {
      const board = document.getElementById('gameBoard');
      board.innerHTML = '';
      
      cards.forEach((card, index) => {
        const cardElement = document.createElement('div');
        cardElement.className = 'card';
        cardElement.dataset.index = index;
        cardElement.innerHTML = `
          <div class="card-back">❓</div>
          <div class="card-front">${card.emoji}</div>
        `;
        cardElement.addEventListener('click', () => flipCard(index));
        board.appendChild(cardElement);
      });
    }

    function flipCard(index) {
      if (flippedCards.length === 2) return;
      
      const cardElement = document.querySelectorAll('.card')[index];
      if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) return;
      
      cardElement.classList.add('flipped');
      flippedCards.push({ index, emoji: cards[index].emoji });
      
      if (flippedCards.length === 2) {
        moves++;
        updateStats();
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      
      setTimeout(() => {
        if (card1.emoji === card2.emoji) {
          const cardElements = document.querySelectorAll('.card');
          cardElements[card1.index].classList.add('matched');
          cardElements[card2.index].classList.add('matched');
          matchedPairs++;
          questionsUnlocked++;
          updateStats();
          unlockQuestion();
          
          if (matchedPairs === 6) {
            showWinScreen();
          }
        } else {
          const cardElements = document.querySelectorAll('.card');
          cardElements[card1.index].classList.remove('flipped');
          cardElements[card2.index].classList.remove('flipped');
        }
        flippedCards = [];
      }, 800);
    }

    function updateStats() {
      document.getElementById('moves').textContent = moves;
      document.getElementById('pairs').textContent = `${matchedPairs}/6`;
    }

    function unlockQuestion() {
      if (currentQuestionIndex < questions.length) {
        const questionText = document.getElementById('questionText');
        const questionHint = document.querySelector('.question-hint');
        questionText.textContent = questions[currentQuestionIndex];
        questionHint.textContent = `Question ${questionsUnlocked} of 6 unlocked!`;
        document.getElementById('nextQuestionBtn').style.display = 'inline-block';
      }
    }

    function resetQuestion() {
      const questionText = document.getElementById('questionText');
      const questionHint = document.querySelector('.question-hint');
      questionText.textContent = "Match pairs to unlock conversation starters!";
      questionHint.textContent = "Find a match to reveal your first question";
    }

    function showWinScreen() {
      const winScreen = document.getElementById('winScreen');
      const winStats = document.getElementById('winStats');
      winStats.textContent = `You completed the game in ${moves} moves and unlocked ${questionsUnlocked} conversation starters!`;
      winScreen.classList.add('show');
    }

    document.getElementById('newGameBtn').addEventListener('click', (e) => {
      e.preventDefault();
      initGame();
    });

    document.getElementById('nextQuestionBtn').addEventListener('click', (e) => {
      e.preventDefault();
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        const questionText = document.getElementById('questionText');
        const questionHint = document.querySelector('.question-hint');
        questionText.textContent = questions[currentQuestionIndex];
        questionHint.textContent = `Question ${currentQuestionIndex + 1} of ${questionsUnlocked} unlocked`;
      }
      if (currentQuestionIndex === questionsUnlocked - 1) {
        document.getElementById('nextQuestionBtn').style.display = 'none';
      }
    });

    async function onConfigChange(config) {
      document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('subtitle').textContent = config.subtitle || defaultConfig.subtitle;
      document.getElementById('winMessage').textContent = config.win_message || defaultConfig.win_message;
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["game_title", config.game_title || defaultConfig.game_title],
          ["subtitle", config.subtitle || defaultConfig.subtitle],
          ["win_message", config.win_message || defaultConfig.win_message]
        ])
      });
    }

    initGame();
  </script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Train of Thought</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a2e1a;
  font-family: Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;

}

#topbar {

  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

.scard {
  background: rgba(0,0,0,0.55);
  border: 2px solid #4a7a2a;
  border-radius: 8px;
  padding: 6px 18px;
  text-align: center;
  min-width: 90px;
}
.scard-label { font-size: 11px; color: #8aba60; text-transform: uppercase; letter-spacing: 1px; }
.scard-val { font-size: 22px; font-weight: 700; color: #fff; }
.scard-val.timer-warn { color: #ff6b6b; }

#level-badge {
  background: #2d5a27;
  border: 2px solid #8aba60;
  border-radius: 20px;
  padding: 6px 20px;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
}

#canvas-wrap {
  position: relative;
  display: inline-block;
  border-radius: 12px;
  overflow: hidden;
  border: 3px solid #2d5a27;
  box-shadow: 0 6px 30px rgba(0,0,0,0.6);
}
canvas { display: block; }

#goal-banner {
  margin-top: 10px;
  padding: 10px 28px;
  border-radius: 12px;
  border: 3px solid #ccc;
  font-size: 18px;
  font-weight: 600;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  max-width: 680px;
  width: 100%;
  display: none;
}

#choice-area {
  margin-top: 10px;
  min-height: 80px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
}
#choice-label {
  font-size: 16px;
  color: #8aba60;
  font-weight: 700;
  letter-spacing: 0.5px;
}
#choice-btns {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.cbtn {
  font-size: 16px;
  font-weight: 700;
  padding: 12px 28px;
  border-radius: 12px;

#start-btn {

<script>

// ── PERSISTENT SAVE / LOAD ─────────────────────────────────────────────────
async function saveProgress(data) {
  try {
    await window.storage.set(SAVE_KEY, JSON.stringify(data));
    flashSaveIndicator();
  } catch(e) { /* storage unavailable */ }
}

async function loadProgress() {
  try {
    const res = await window.storage.get(SAVE_KEY);
    if (res && res.value) return JSON.parse(res.value);
  } catch(e) {}
  return null;
}

async function clearProgress() {
  try { await window.storage.delete(SAVE_KEY); } catch(e) {}
}

function flashSaveIndicator() {
  const el = document.getElementById('save-indicator');
  el.classList.add('show');
  clearTimeout(flashSaveIndicator._t);
  flashSaveIndicator._t = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── LAYOUT HELPERS (same as original) ─────────────────────────────────────
function getLayout(name) {
  if (name === 'simple') return layoutSimple();
  if (name === 'medium') return layoutMedium();
  return layoutHard();
}

function layoutSimple() {
  const stations = { red:{x:80,y:60}, blue:{x:600,y:60}, green:{x:80,y:360}, yellow:{x:600,y:360}, purple:{x:340,y:390}, orange:{x:340,y:30} };
  const junctions = { JA:{x:200,y:200}, JB:{x:480,y:200}, JC:{x:340,y:280} };
  const paths = {
    spawn_to_JA: makeCurvedPath({x:30,y:200},{x:200,y:200},[{x:100,y:200}]),
    JA_to_red:   makeCurvedPath({x:200,y:200},{x:80,y:60},[{x:200,y:60}]),
    JA_to_green: makeCurvedPath({x:200,y:200},{x:80,y:360},[{x:200,y:360}]),
    JA_to_JB:    makeCurvedPath({x:200,y:200},{x:480,y:200},[{x:340,y:200}]),
    JB_to_blue:  makeCurvedPath({x:480,y:200},{x:600,y:60},[{x:480,y:60}]),
    JB_to_JC:    makeCurvedPath({x:480,y:200},{x:340,y:280},[{x:400,y:280}]),
    JC_to_yellow:makeCurvedPath({x:340,y:280},{x:600,y:360},[{x:480,y:360}]),
    JC_to_purple:makeCurvedPath({x:340,y:280},{x:340,y:390},[{x:340,y:340}]),
  };
  const junctionDefs = {
    JA:{ pt:junctions.JA, choices:[
      {label:'Red',color:'red',path:combinePaths(paths.JA_to_red),dest:'red'},
      {label:'Green',color:'green',path:combinePaths(paths.JA_to_green),dest:'green'},
      {label:'Forward',color:null,path:combinePaths(paths.JA_to_JB),dest:null,next:'JB'},
    ]},
    JB:{ pt:junctions.JB, choices:[
      {label:'Blue',color:'blue',path:combinePaths(paths.JB_to_blue),dest:'blue'},
      {label:'South',color:null,path:combinePaths(paths.JB_to_JC),dest:null,next:'JC'},
    ]},
    JC:{ pt:junctions.JC, choices:[
      {label:'Yellow',color:'yellow',path:combinePaths(paths.JC_to_yellow),dest:'yellow'},
      {label:'Purple',color:'purple',path:combinePaths(paths.JC_to_purple),dest:'purple'},

    JA_to_JD:     makeCurvedPath({x:160,y:200},{x:240,y:320},[{x:160,y:320}]),
    JB_to_blue:   makeCurvedPath({x:320,y:130},{x:600,y:50},[{x:460,y:50}]),

    JD_to_JE:     makeCurvedPath({x:240,y:320},{x:440,y:320},[{x:340,y:320}]),
    JE_to_purple: makeCurvedPath({x:440,y:320},{x:440,y:400},[{x:440,y:360}]),
    JE_to_orange: makeCurvedPath({x:440,y:320},{x:620,y:380},[{x:540,y:380}]),
  };
  const junctionDefs = {

      {label:'Up →',color:null,path:combinePaths(paths.JA_to_JB),dest:null,next:'JB'},

    ]},
    JB:{ pt:junctions.JB, choices:[
      {label:'Blue',color:'blue',path:combinePaths(paths.JB_to_blue),dest:'blue'},
      {label:'East →',color:null,path:combinePaths(paths.JB_to_JC),dest:null,next:'JC'},
    ]},
    JC:{ pt:junctions.JC, choices:[
      {label:'Blue',color:'blue',path:combinePaths(paths.JC_to_blue),dest:'blue'},
      {label:'Orange',color:'orange',path:combinePaths(paths.JC_to_orange),dest:'orange'},
      {label:'South ↓',color:null,path:combinePaths(paths.JC_to_JE),dest:null,next:'JE'},
    ]},
    JD:{ pt:junctions.JD, choices:[
      {label:'Yellow',color:'yellow',path:combinePaths(paths.JD_to_yellow),dest:'yellow'},
      {label:'East →',color:null,path:combinePaths(paths.JD_to_JE),dest:null,next:'JE'},
    ]},
    JE:{ pt:junctions.JE, choices:[
      {label:'Purple',color:'purple',path:combinePaths(paths.JE_to_purple),dest:'purple'},

  return { stations, junctions, junctionDefs, paths, spawnPath:combinePaths(paths.spawn_to_JA), firstJunction:'JA' };

// ── PATH HELPERS ───────────────────────────────────────────────────────────
function makeCurvedPath(from, to, controls) {
  const pts = [from, ...controls, to];
  const result = [];
  const steps = 40;
  for (let i = 0; i <= steps; i++) result.push(catmullRom(pts, i / steps));
  return result;
}

function catmullRom(pts, t) {
  const n = pts.length - 1;
  const seg = Math.min(Math.floor(t * n), n - 1);
  const lt = (t * n) - seg;
  const p0=pts[Math.max(seg-1,0)], p1=pts[seg], p2=pts[Math.min(seg+1,n)], p3=pts[Math.min(seg+2,n)];
  const x=0.5*((2*p1.x)+(-p0.x+p2.x)*lt+(2*p0.x-5*p1.x+4*p2.x-p3.x)*lt*lt+(-p0.x+3*p1.x-3*p2.x+p3.x)*lt*lt*lt);
  const y=0.5*((2*p1.y)+(-p0.y+p2.y)*lt+(2*p0.y-5*p1.y+4*p2.y-p3.y)*lt*lt+(-p0.y+3*p1.y-3*p2.y+p3.y)*lt*lt*lt);
  return { x, y };
}

function combinePaths(...pathArrays) {
  const combined = [];
  pathArrays.forEach((p, i) => { if (i===0) combined.push(...p); else combined.push(...p.slice(1)); });
  return combined;
}

function segLens(path) {
  const l=[0];
  for (let i=0;i<path.length-1;i++) { const dx=path[i+1].x-path[i].x,dy=path[i+1].y-path[i].y; l.push(l[i]+Math.sqrt(dx*dx+dy*dy)); }
  return l;
}

function ptAt(path, lens, dist) {
  if (!path||path.length===0) return {x:0,y:0};
  const tot=lens[lens.length-1];
  dist=Math.max(0,Math.min(dist,tot));
  if (dist>=tot) return {...path[path.length-1]};
  let seg=0;
  for (let i=0;i<path.length-2;i++) { if (lens[i+1]>dist){seg=i;break;} }
  const sd=lens[seg+1]-lens[seg]||1, t=(dist-lens[seg])/sd;
  return { x:path[seg].x+(path[seg+1].x-path[seg].x)*t, y:path[seg].y+(path[seg+1].y-path[seg].y)*t };
}

// ── GAME STATE ─────────────────────────────────────────────────────────────
let gameState='idle', currentLevel=0, layout=null;
let trainColor=null, trainGoal=null;
let trainPath=[], trainPathLens=[];
let trainDist=0, trainSpeed=80;
let waitingAt=null, animating=false;
let celebrating=false, celebTimer=0;
let score=0, totalCorrect=0, totalRounds=0;
let roundIndex=0;
let timerSecs=120, timerInterval=null;
let raf=null, lastTime=null;
let smokeParticles=[];

// Saved state — highest unlocked level across sessions
let savedHighestLevel = 0;
let startBtnMode = 'new'; // 'new' | 'resume' | 'retry' | 'next'

// ── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  const saved = await loadProgress();
  if (saved && saved.highestLevel > 0) {
    savedHighestLevel = Math.min(saved.highestLevel, LEVELS.length - 1);
    const lvName = LEVELS[savedHighestLevel].name;
    setMsg('Welcome back! You reached ' + lvName + '.');
    document.getElementById('start-btn').textContent = 'Resume from ' + lvName;
    document.getElementById('reset-btn').style.display = '';
    startBtnMode = 'resume';
  } else {
    setMsg('Press Start to play!');
    document.getElementById('start-btn').textContent = 'Start Game';
    startBtnMode = 'new';
  }
  updateUI();
  draw();
}

async function resetProgress() {
  if (!confirm('Reset all progress and start from Level 1?')) return;
  await clearProgress();
  savedHighestLevel = 0;
  currentLevel = 0;
  score = 0; totalCorrect = 0; totalRounds = 0;
  startBtnMode = 'new';
  document.getElementById('start-btn').textContent = 'Start Game';
  document.getElementById('reset-btn').style.display = 'none';
  gameState = 'idle';
  cancelAnimationFrame(raf);
  clearInterval(timerInterval);
  clearChoices();
  document.getElementById('goal-banner').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  updateUI();
  setMsg('Progress reset. Press Start to play!');
  draw();
}

function onStartBtnClick() {
  if (startBtnMode === 'resume') {
    currentLevel = savedHighestLevel;
    score = 0; totalCorrect = 0; totalRounds = 0;
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    updateUI();
    startLevel();
  } else if (startBtnMode === 'retry') {
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    score = 0; totalCorrect = 0; totalRounds = 0;
    updateUI();
    startLevel();
  } else if (startBtnMode === 'next') {
    currentLevel++;
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    score = 0; totalCorrect = 0; totalRounds = 0;
    updateUI();
    startLevel();
  } else {
    // new game
    currentLevel = 0;
    score = 0; totalCorrect = 0; totalRounds = 0;
    document.getElementById('start-btn').style.display = 'none';
    document.getElementById('reset-btn').style.display = 'none';
    updateUI();
    startLevel();
  }
}

// ── GAME FLOW ──────────────────────────────────────────────────────────────
function startLevel() {
  const lv = LEVELS[currentLevel];
  layout = getLayout(lv.layout);
  trainSpeed = lv.speed;
  roundIndex = 0;
  timerSecs = lv.time;
  document.getElementById('level-badge').textContent = lv.name.toUpperCase();
  document.getElementById('progress-bar').style.display = 'block';
  clearInterval(timerInterval);
  timerInterval = setInterval(tickTimer, 1000);
  startRound();
}

function tickTimer() {
  if (gameState==='idle'||gameState==='done') return;
  timerSecs--;
  updateTimer();
  if (timerSecs<=0) { clearInterval(timerInterval); levelFailed(); }
}

function levelFailed() {
  gameState='done';
  cancelAnimationFrame(raf);
  clearChoices();
  document.getElementById('goal-banner').style.display='none';
  setMsg('⏰ Time up! Score: '+score+' — Try again!');
  document.getElementById('start-btn').textContent = 'Retry Level ' + (currentLevel+1);
  document.getElementById('start-btn').style.display = '';
  document.getElementById('reset-btn').style.display = savedHighestLevel > 0 ? '' : 'none';
  startBtnMode = 'retry';
}

function startRound() {
  const lv = LEVELS[currentLevel];
  if (roundIndex >= lv.trains.length) { levelComplete(); return; }
  trainColor = lv.trains[roundIndex];
  trainGoal  = trainColor;
  const c    = COLORS[trainColor];
  totalRounds = lv.trains.length;
  updateProgress();
  const gb = document.getElementById('goal-banner');
  gb.style.display='block';
  gb.style.borderColor=c.fill;
  gb.innerHTML='Guide the <span style="color:'+c.fill+';font-weight:800">'+c.label+' train</span> to the <span style="color:'+c.fill+';font-weight:800">'+c.label+' Station</span>';
  trainPath=layout.spawnPath; trainPathLens=segLens(trainPath);
  trainDist=0; animating=true; waitingAt=null; celebrating=false; smokeParticles=[];
  gameState='moving';
  clearChoices();
  setMsg('The '+c.label+' train is on its way...');
  lastTime=null;
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

async function levelComplete() {
  clearInterval(timerInterval);
  gameState='done';
  const bonus=timerSecs*5;
  score+=bonus;
  updateUI();

  // Save progress — unlock next level
  const newHighest = Math.min(currentLevel + 1, LEVELS.length - 1);
  if (newHighest > savedHighestLevel) {
    savedHighestLevel = newHighest;
    await saveProgress({ highestLevel: savedHighestLevel });
  }

  const isLast = currentLevel >= LEVELS.length - 1;
  setMsg(isLast
    ? '🎉 Amazing! You beat all levels! Final score: '+score
    : '✅ Level '+(currentLevel+1)+' complete! Bonus: +'+bonus+' pts — Progress saved!');
  document.getElementById('goal-banner').style.display='none';
  clearChoices();

  if (isLast) {
    document.getElementById('start-btn').textContent = 'Play Again';
    startBtnMode = 'new';
    currentLevel = 0;
  } else {
    document.getElementById('start-btn').textContent = 'Next Level →';
    startBtnMode = 'next';
  }
  document.getElementById('start-btn').style.display='';
  document.getElementById('reset-btn').style.display='';
}

function loop(ts) {
  if (!lastTime) lastTime=ts;
  const dt=Math.min((ts-lastTime)/1000,0.1);
  lastTime=ts;
  if (gameState==='moving'&&animating) {
    trainDist+=trainSpeed*dt;
    if (trainDist>=trainPathLens[trainPathLens.length-1]) {
      trainDist=trainPathLens[trainPathLens.length-1];
      animating=false;
      onSegmentEnd();
    }
    if (Math.random()<0.4) {
      const pos=ptAt(trainPath,trainPathLens,trainDist);
      smokeParticles.push({x:pos.x,y:pos.y-10,life:1,r:4+Math.random()*3});
    }
  }
  smokeParticles=smokeParticles.filter(p=>p.life>0);
  smokeParticles.forEach(p=>{p.life-=dt*1.2;p.y-=dt*20;p.r+=dt*3;});
  if (celebrating) {
    celebTimer-=dt;
    if (celebTimer<=0) { celebrating=false; roundIndex++; startRound(); return; }
  }
  draw();
  raf=requestAnimationFrame(loop);
}

function onSegmentEnd() {
  const endPt=trainPath[trainPath.length-1];
  const arrived=Object.keys(layout.stations).find(k=>{
    const s=layout.stations[k];
    return Math.hypot(s.x-endPt.x,s.y-endPt.y)<20;
  });
  if (arrived) {
    if (arrived===trainGoal) {
      const pts=100+Math.floor(timerSecs*0.5);
      score+=pts; totalCorrect++;
      updateUI();
      setMsg('✅ '+COLORS[trainGoal].label+' train delivered! +'+pts+' pts');
    } else {
      score=Math.max(0,score-30);
      updateUI();
      setMsg('❌ Wrong station! -30 pts');
    }
    celebrating=true; celebTimer=1.8;
    clearChoices();
    document.getElementById('goal-banner').style.display='none';
    return;
  }
  const jKey=Object.keys(layout.junctionDefs).find(k=>{
    const j=layout.junctionDefs[k];
    return Math.hypot(j.pt.x-endPt.x,j.pt.y-endPt.y)<20;
  });
  if (jKey) {
    waitingAt=jKey; gameState='waiting';
    showChoices(jKey);
    setMsg('🚦 Choose where the train goes!');
  }
}

function showChoices(jKey) {
  const junc=layout.junctionDefs[jKey];
  document.getElementById('choice-label').textContent='↙ Junction: which way?';
  const btns=document.getElementById('choice-btns');
  btns.innerHTML='';
  junc.choices.forEach(ch=>{
    const btn=document.createElement('button');
    btn.className='cbtn';
    const chCol=ch.color?COLORS[ch.color]:null;
    if (chCol) { btn.style.background=chCol.fill; btn.style.borderColor=chCol.dark; btn.style.color='#fff'; }
    else { btn.style.background='#2d4a1a'; btn.style.borderColor='#8aba60'; btn.style.color='#fff'; }
    btn.textContent=ch.label;
    btn.onclick=()=>onChoice(ch);
    btns.appendChild(btn);
  });
}

function onChoice(ch) {
  clearChoices();
  setMsg('Heading to '+ch.label+'...');
  trainPath=ch.path; trainPathLens=segLens(trainPath);
  trainDist=0; animating=true; waitingAt=null; gameState='moving';
}

// ── UI HELPERS ─────────────────────────────────────────────────────────────
function clearChoices() {
  document.getElementById('choice-label').textContent='';
  document.getElementById('choice-btns').innerHTML='';
}
function setMsg(t) { document.getElementById('msg').textContent=t; }
function updateUI() {
  document.getElementById('score').textContent=score;
  document.getElementById('correct').textContent=totalCorrect+' / '+totalRounds;
  updateTimer();
}
function updateTimer() {
  const m=Math.floor(timerSecs/60), s=timerSecs%60;
  const el=document.getElementById('timer');
  el.textContent=m+':'+String(s).padStart(2,'0');
  el.className='scard-val'+(timerSecs<=15?' timer-warn':'');
}
function updateProgress() {
  const lv=LEVELS[currentLevel];
  document.getElementById('progress-fill').style.width=(roundIndex/lv.trains.length*100)+'%';
}

// ── DRAW ───────────────────────────────────────────────────────────────────
function drawBg() {
  cx.fillStyle='#2d5a27'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#336028';
  for (let i=0;i<300;i++) cx.fillRect(((i*97+13)%W),((i*61+7)%H),2,2);
  [[50,180],[620,180],[170,380],[500,60],[290,390],[390,40],[100,140],[580,300]].forEach(([tx,ty])=>drawTree(tx,ty));
}

function drawTree(x,y) {
  cx.fillStyle='#1a4010'; cx.beginPath(); cx.moveTo(x,y-14); cx.lineTo(x+10,y+8); cx.lineTo(x-10,y+8); cx.closePath(); cx.fill();
  cx.fillStyle='#22550e'; cx.beginPath(); cx.moveTo(x,y-20); cx.lineTo(x+7,y-4); cx.lineTo(x-7,y-4); cx.closePath(); cx.fill();
}

function drawCurvedTrack(path) {
  if (!path||path.length<2) return;
  cx.strokeStyle='#1a3a18'; cx.lineWidth=16; cx.lineCap='round'; cx.lineJoin='round';
  cx.beginPath(); cx.moveTo(path[0].x,path[0].y);
  for (let i=1;i<path.length;i++) cx.lineTo(path[i].x,path[i].y);
  cx.stroke();
  ['left','right'].forEach(side=>{
    cx.strokeStyle='#8aba60'; cx.lineWidth=3; cx.beginPath();
    for (let i=0;i<path.length;i++) {
      const p=path[i]; let nx=0,ny=1;
      if (i<path.length-1){const dx=path[i+1].x-p.x,dy=path[i+1].y-p.y,l=Math.sqrt(dx*dx+dy*dy)||1;nx=-dy/l;ny=dx/l;}
      const s=side==='left'?5:-5;
      const rx=p.x+nx*s,ry=p.y+ny*s;
      if (i===0) cx.moveTo(rx,ry); else cx.lineTo(rx,ry);
    }
    cx.stroke();
  });
  cx.strokeStyle='#4a6a30'; cx.lineWidth=2;
  for (let i=1;i<path.length-1;i+=4) {
    const p=path[i]; let dx=1,dy=0;
    if (i<path.length-1){dx=path[i+1].x-p.x;dy=path[i+1].y-p.y;const l=Math.sqrt(dx*dx+dy*dy)||1;dx/=l;dy/=l;}
    const nx=-dy,ny=dx;
    cx.beginPath(); cx.moveTo(p.x+nx*7,p.y+ny*7); cx.lineTo(p.x-nx*7,p.y-ny*7); cx.stroke();
  }
}

function drawAllTracks() {
  if (!layout) return;
  Object.values(layout.paths).forEach(p=>drawCurvedTrack(p));
}

function drawStation(colorKey) {
  const pos=layout.stations[colorKey]; if (!pos) return;
  const c=COLORS[colorKey];
  const isGoal=colorKey===trainGoal&&gameState!=='idle'&&gameState!=='done';
  if (isGoal) {
    const pulse=Math.abs(Math.sin(Date.now()/350))*0.7+0.3;
    cx.save(); cx.globalAlpha=pulse; cx.strokeStyle=c.fill; cx.lineWidth=4;
    cx.beginPath(); cx.arc(pos.x,pos.y,30,0,Math.PI*2); cx.stroke(); cx.restore();
  }
  cx.fillStyle=c.fill; cx.strokeStyle=c.dark; cx.lineWidth=2.5;
  cx.beginPath(); cx.roundRect(pos.x-22,pos.y-14,44,28,5); cx.fill(); cx.stroke();
  cx.fillStyle=c.dark; cx.beginPath(); cx.moveTo(pos.x-26,pos.y-14); cx.lineTo(pos.x+26,pos.y-14); cx.lineTo(pos.x+18,pos.y-30); cx.lineTo(pos.x-18,pos.y-30); cx.closePath(); cx.fill();
  cx.fillStyle=c.dark; cx.fillRect(pos.x-12,pos.y-38,8,10);
  cx.fillStyle='rgba(255,255,255,0.85)';
  cx.beginPath(); cx.roundRect(pos.x-18,pos.y-10,10,8,2); cx.fill();
  cx.beginPath(); cx.roundRect(pos.x+8,pos.y-10,10,8,2); cx.fill();
  cx.fillStyle=c.dark; cx.beginPath(); cx.roundRect(pos.x-5,pos.y+2,10,12,2); cx.fill();
  cx.fillStyle='#fff'; cx.font='bold 10px Georgia,serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(c.label[0],pos.x,pos.y-2);
}

function drawJunction(jKey) {
  const j=layout.junctionDefs[jKey];
  const isWaiting=waitingAt===jKey&&gameState==='waiting';
  cx.fillStyle=isWaiting?'#fff176':'#d4e8a0'; cx.strokeStyle=isWaiting?'#f9a825':'#4a7a2a'; cx.lineWidth=isWaiting?3.5:2;
  cx.beginPath(); cx.arc(j.pt.x,j.pt.y,14,0,Math.PI*2); cx.fill(); cx.stroke();
  cx.fillStyle='#2d4a1a'; cx.font='bold 9px Georgia,serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(jKey,j.pt.x,j.pt.y);
}

function drawTrain() {
  if (gameState==='idle'||gameState==='done') return;
  if (!trainPath||trainPath.length===0) return;
  const pos=ptAt(trainPath,trainPathLens,trainDist);
  const c=COLORS[trainColor];
  let dx=1,dy=0;
  if (trainDist>5){const prev=ptAt(trainPath,trainPathLens,Math.max(0,trainDist-8));dx=pos.x-prev.x;dy=pos.y-prev.y;const l=Math.sqrt(dx*dx+dy*dy)||1;dx/=l;dy/=l;}
  smokeParticles.forEach(p=>{
    cx.save(); cx.globalAlpha=p.life*0.5; cx.fillStyle='#ccc';
    cx.beginPath(); cx.arc(p.x,p.y,p.r,0,Math.PI*2); cx.fill(); cx.restore();
  });
  cx.save(); cx.translate(pos.x,pos.y); cx.rotate(Math.atan2(dy,dx));
  if (celebrating){const bounce=Math.abs(Math.sin(celebTimer*12))*8;cx.translate(0,-bounce);}
  cx.fillStyle='rgba(0,0,0,0.3)'; cx.beginPath(); cx.ellipse(3,16,20,5,0,0,Math.PI*2); cx.fill();
  cx.fillStyle=c.fill; cx.strokeStyle=c.dark; cx.lineWidth=2.5;
  cx.beginPath(); cx.roundRect(-24,-13,48,26,6); cx.fill(); cx.stroke();
  cx.fillStyle=c.dark; cx.beginPath(); cx.roundRect(20,-9,8,18,3); cx.fill();
  cx.fillStyle=c.dark; cx.strokeStyle='rgba(0,0,0,0.2)'; cx.lineWidth=1;
  cx.beginPath(); cx.roundRect(-12,-25,22,14,4); cx.fill(); cx.stroke();
  cx.fillStyle='rgba(255,255,255,0.9)';
  cx.beginPath(); cx.roundRect(-20,-10,14,9,2); cx.fill();
  cx.beginPath(); cx.roundRect(5,-10,12,9,2); cx.fill();
  cx.beginPath(); cx.roundRect(-10,-23,8,8,2); cx.fill();
  cx.fillStyle=c.dark; cx.beginPath(); cx.roundRect(-16,-30,8,10,2); cx.fill();
  cx.fillStyle='#222'; cx.beginPath(); cx.roundRect(-18,-32,12,4,2); cx.fill();
  cx.strokeStyle=c.dark; cx.lineWidth=1.5; cx.globalAlpha=0.4;
  cx.beginPath(); cx.moveTo(-5,-13); cx.lineTo(-5,13); cx.stroke();
  cx.beginPath(); cx.moveTo(5,-13); cx.lineTo(5,13); cx.stroke();
  cx.globalAlpha=1;
  [-14,0,14].forEach(ox=>{
    cx.fillStyle='#1a1a1a'; cx.strokeStyle=c.wheel||'#555'; cx.lineWidth=1.5;
    cx.beginPath(); cx.arc(ox,14,7,0,Math.PI*2); cx.fill(); cx.stroke();
    cx.strokeStyle='#777'; cx.lineWidth=1;
    cx.beginPath(); cx.moveTo(ox-5,14); cx.lineTo(ox+5,14); cx.stroke();
    cx.beginPath(); cx.moveTo(ox,9); cx.lineTo(ox,19); cx.stroke();
    cx.fillStyle='#bbb'; cx.beginPath(); cx.arc(ox,14,2,0,Math.PI*2); cx.fill();
  });
  cx.strokeStyle='#888'; cx.lineWidth=2;
  cx.beginPath(); cx.moveTo(-14,14); cx.lineTo(14,14); cx.stroke();
  cx.fillStyle='#fff'; cx.font='bold 11px Georgia,serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(c.label[0],0,1);
  cx.restore();
  if (gameState==='waiting'){
    const pulse=Math.abs(Math.sin(Date.now()/220));
    cx.strokeStyle=`rgba(255,255,100,${0.5+pulse*0.5})`; cx.lineWidth=3+pulse*3;
    cx.beginPath(); cx.arc(pos.x,pos.y,30,0,Math.PI*2); cx.stroke();
  }
}

function drawCelebration() {
  if (!celebrating) return;
  const cols=['#E53935','#1E88E5','#43A047','#F9A825','#8E24AA','#F4511E','#fff'];
  const t=Date.now()/300;
  const pos=ptAt(trainPath,trainPathLens,trainPathLens[trainPathLens.length-1]);
  for (let i=0;i<24;i++){
    const a=i/24*Math.PI*2+t, r=60+Math.sin(t*2.5+i)*25;
    cx.fillStyle=cols[i%cols.length];
    cx.beginPath(); cx.arc(pos.x+Math.cos(a)*r,pos.y+Math.sin(a)*r,5+Math.sin(t+i)*2,0,Math.PI*2); cx.fill();
  }
}

function drawIdleOverlay() {
  cx.fillStyle='rgba(0,0,0,0.72)'; cx.fillRect(0,0,W,H);
  cx.fillStyle='#fff'; cx.font='bold 34px Georgia,serif'; cx.textAlign='center';
  cx.fillText('Train of Thought',W/2,H/2-70);
  cx.font='17px Georgia,serif'; cx.fillStyle='#c8e6c9';
  cx.fillText('Guide each coloured train to its matching station',W/2,H/2-30);
  cx.font='14px Georgia,serif'; cx.fillStyle='#aaa';
  cx.fillText('The train stops at junctions — you choose the direction!',W/2,H/2+0);
  cx.fillText('5 Levels · Increasing speed · Beat the clock!',W/2,H/2+24);
  if (savedHighestLevel > 0) {
    cx.font='bold 13px Georgia,serif'; cx.fillStyle='#8aba60';
    cx.fillText('Your progress: ' + LEVELS[savedHighestLevel].name + ' unlocked',W/2,H/2+50);
  }
  Object.keys(COLORS).forEach((k,i)=>{
    const x=W/2-125+i*52, y=H/2+75;
    cx.fillStyle=COLORS[k].fill; cx.beginPath(); cx.arc(x,y,14,0,Math.PI*2); cx.fill();
    cx.fillStyle='#fff'; cx.font='bold 10px Georgia,serif'; cx.textAlign='center'; cx.textBaseline='middle';
    cx.fillText(COLORS[k].label[0],x,y);
  });
}

function draw() {
  cx.clearRect(0,0,W,H);
  drawBg();
  if (layout) {
    drawAllTracks();
    Object.keys(layout.stations).forEach(drawStation);
    Object.keys(layout.junctionDefs).forEach(drawJunction);
    drawTrain();
    drawCelebration();
  }
  if (gameState==='idle') drawIdleOverlay();
}

(function renderLoop() {
  if (gameState==='idle'||gameState==='done') draw();
  requestAnimationFrame(renderLoop);
})();

// Boot
init();
</script>
</body>
</html>
